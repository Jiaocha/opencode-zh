name: zh-release

on:
  schedule:
    # Every 24 hours: check anomalyco/opencode@dev at 02:00 Beijing time.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream branch, tag, or commit to check for version updates"
        required: false
        default: "dev"
      create_release:
        description: "Create or update a GitHub Release after build"
        required: false
        type: boolean
        default: true
      force_release:
        description: "Re-localize, rebuild, and release the current downstream version even without an upstream version update"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: zh-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UPSTREAM_REPO: anomalyco/opencode
  DOWNSTREAM_REPO: Jiaocha/opencode-zh
  DEFAULT_UPSTREAM_REF: dev
  BUILD_TARGETS: linux-x64,linux-arm64,windows-x64

jobs:
  sync-localize:
    name: Sync upstream and apply zh-CN localization
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      should_release: ${{ steps.plan.outputs.should_release }}
      upstream_ref: ${{ steps.plan.outputs.upstream_ref }}
      upstream_before: ${{ steps.plan.outputs.upstream_before }}
      upstream_after: ${{ steps.plan.outputs.upstream_after }}
      current_version: ${{ steps.plan.outputs.current_version }}
      upstream_version: ${{ steps.plan.outputs.upstream_version }}
      head_sha: ${{ steps.push.outputs.head_sha }}
      version: ${{ steps.release_notes.outputs.version }}
      tag: ${{ steps.release_notes.outputs.tag }}
      title: ${{ steps.release_notes.outputs.title }}
    steps:
      - name: Checkout downstream repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.ZH_RELEASE_TOKEN || github.token }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Plan upstream synchronization
        id: plan
        env:
          UPSTREAM_REF_INPUT: ${{ github.event.inputs.upstream_ref }}
          CREATE_RELEASE_INPUT: ${{ github.event.inputs.create_release }}
          FORCE_RELEASE_INPUT: ${{ github.event.inputs.force_release }}
        run: |
          set -euo pipefail

          upstream_ref="${UPSTREAM_REF_INPUT:-$DEFAULT_UPSTREAM_REF}"
          create_release="${CREATE_RELEASE_INPUT:-true}"
          force_release="${FORCE_RELEASE_INPUT:-false}"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || \
            git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "$upstream_ref" --tags --prune

          preserve_dir="$(mktemp -d)"
          preserve_items=(
            README.md
            localization
            .github/workflows/zh-release.yml
            .github/actions/setup-bun/action.yml
            script/zh-release-notes.ts
            packages/desktop/electron-builder.config.ts
            packages/desktop/scripts/stage-electron-builder.ts
          )

          for item in "${preserve_items[@]}"; do
            if [ -e "$item" ]; then
              mkdir -p "$preserve_dir/$(dirname "$item")"
              cp -a "$item" "$preserve_dir/$item"
            fi
          done

          upstream_sha="$(git rev-parse FETCH_HEAD)"
          upstream_before="$(git merge-base HEAD "$upstream_sha")"
          current_version="$(node -e "const fs = require('fs'); const text = fs.readFileSync('packages/opencode/package.json', 'utf8').replace(/^\uFEFF+/, ''); console.log(JSON.parse(text).version)")"
          upstream_version="$(git show "$upstream_sha:packages/opencode/package.json" | node -e "let data = ''; process.stdin.setEncoding('utf8'); process.stdin.on('data', (chunk) => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data.replace(/^\uFEFF+/, '')).version))")"

          {
            echo "upstream_ref=$upstream_ref"
            echo "upstream_before=$upstream_before"
            echo "upstream_after=$upstream_sha"
            echo "current_version=$current_version"
            echo "upstream_version=$upstream_version"
          } >> "$GITHUB_OUTPUT"

          echo "Current downstream version: $current_version"
          echo "Upstream $UPSTREAM_REPO@$upstream_ref version: $upstream_version"

          if [ "$upstream_version" = "$current_version" ]; then
            if [ "$force_release" != "true" ]; then
              echo "No upstream version update detected; skipping localization, build, and release."
              {
                echo "should_build=false"
                echo "should_release=false"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "No upstream version update detected, but force_release=true; rebuilding current downstream version without merging non-version upstream commits."
          else
            echo "Upstream version update detected: $current_version -> $upstream_version"
            if git merge-base --is-ancestor "$upstream_sha" HEAD; then
              echo "Upstream commit is already included; continuing localization and build."
            else
              git merge --no-edit --no-ff -X theirs "$upstream_sha"
              for item in "${preserve_items[@]}"; do
                if [ -e "$preserve_dir/$item" ]; then
                  rm -rf "$item"
                  mkdir -p "$(dirname "$item")"
                  cp -a "$preserve_dir/$item" "$item"
                fi
              done
            fi
          fi

          {
            echo "should_build=true"
            echo "should_release=$create_release"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        if: steps.plan.outputs.should_build == 'true'
        uses: ./.github/actions/setup-bun

      - name: Apply Simplified Chinese localization
        if: steps.plan.outputs.should_build == 'true'
        run: bun run ./localization/scripts/localize-onekey.ts

      - name: Check localization completeness
        if: steps.plan.outputs.should_build == 'true'
        run: bun run ./localization/scripts/check-complete.ts

      - name: Commit and push localized downstream state
        if: steps.plan.outputs.should_build == 'true'
        id: push
        run: |
          set -euo pipefail

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync upstream and apply zh-CN localization [skip ci]"
          else
            echo "No localization changes generated."
          fi

          head_sha="$(git rev-parse HEAD)"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Generate Chinese release notes
        if: steps.plan.outputs.should_build == 'true'
        id: release_notes
        env:
          UPSTREAM_REF: ${{ steps.plan.outputs.upstream_ref }}
          UPSTREAM_BEFORE: ${{ steps.plan.outputs.upstream_before }}
          UPSTREAM_AFTER: ${{ steps.plan.outputs.upstream_after }}
          DOWNSTREAM_SHA: ${{ steps.push.outputs.head_sha }}
        run: bun run ./script/zh-release-notes.ts

      - name: Upload release notes
        if: steps.plan.outputs.should_build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-zh-release-notes
          path: ${{ steps.release_notes.outputs.notes }}
          if-no-files-found: error
          retention-days: 14

  quality-gate:
    name: Validate zh-CN localization and source
    runs-on: ubuntu-latest
    needs: sync-localize
    if: needs.sync-localize.outputs.should_build == 'true'
    steps:
      - name: Checkout localized commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.sync-localize.outputs.head_sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Verify localization dictionaries
        run: bun run ./localization/scripts/verify-localization.ts

      - name: Check localization completeness
        run: bun run ./localization/scripts/check-complete.ts

      - name: Run repository typecheck
        run: bun typecheck

  build-cli:
    name: Build zh-CN CLI assets
    runs-on: ubuntu-latest
    needs:
      - sync-localize
      - quality-gate
    if: needs.sync-localize.outputs.should_build == 'true'
    steps:
      - name: Checkout localized commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.sync-localize.outputs.head_sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Build selected release targets
        env:
          OPENCODE_VERSION: ${{ needs.sync-localize.outputs.version }}
        run: bun run ./packages/opencode/script/build.ts --targets "$BUILD_TARGETS" --archive

      - name: Verify build artifacts
        env:
          OPENCODE_VERSION: ${{ needs.sync-localize.outputs.version }}
        run: |
          set -euo pipefail

          linux_x64="packages/opencode/dist/opencode-linux-x64.tar.gz"
          linux_arm64="packages/opencode/dist/opencode-linux-arm64.tar.gz"
          windows_x64="packages/opencode/dist/opencode-windows-x64.zip"

          test -s "$linux_x64"
          test -s "$linux_arm64"
          test -s "$windows_x64"

          tar -tzf "$linux_x64" | grep -E '(^|/)opencode$'
          tar -tzf "$linux_arm64" | grep -E '(^|/)opencode$'
          unzip -l "$windows_x64" | grep -E 'opencode(.exe)?$'

          mkdir -p "$RUNNER_TEMP/opencode-smoke"
          tar -xzf "$linux_x64" -C "$RUNNER_TEMP/opencode-smoke"
          chmod +x "$RUNNER_TEMP/opencode-smoke/opencode"
          "$RUNNER_TEMP/opencode-smoke/opencode" --version | grep "$OPENCODE_VERSION"

      - name: Upload CLI assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-zh-cli-assets
          path: |
            packages/opencode/dist/opencode-linux-x64.tar.gz
            packages/opencode/dist/opencode-linux-arm64.tar.gz
            packages/opencode/dist/opencode-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  build-desktop:
    name: Build zh-CN desktop assets (${{ matrix.settings.name }})
    runs-on: ${{ matrix.settings.host }}
    needs:
      - sync-localize
      - quality-gate
    if: needs.sync-localize.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux-x64
            host: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            platform_flag: --linux
          - name: linux-arm64
            host: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            platform_flag: --linux --arm64
          - name: windows-x64
            host: windows-2025
            rust_target: x86_64-pc-windows-msvc
            platform_flag: --win
    steps:
      - name: Checkout localized commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.sync-localize.outputs.head_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: ${{ runner.os == 'Windows' && '' || '--linker hoisted' }}

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - name: Prepare desktop build
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          OPENCODE_VERSION: ${{ needs.sync-localize.outputs.version }}
          OPENCODE_CHANNEL: prod
          RUST_TARGET: ${{ matrix.settings.rust_target }}

      - name: Build desktop app
        run: bun run build
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod

      - name: Stage desktop app for packaging
        run: bun ./scripts/stage-electron-builder.ts
        working-directory: packages/desktop

      - name: Package desktop app
        run: npx electron-builder ${{ matrix.settings.platform_flag }} --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_SKIP_SIGNING: "true"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Normalize desktop artifact names
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.settings.name }}" in
            linux-x64)
              mv -f packages/desktop/dist/opencode-desktop-linux-x86_64.AppImage packages/desktop/dist/opencode-desktop-linux-x64.AppImage
              mv -f packages/desktop/dist/opencode-desktop-linux-amd64.deb packages/desktop/dist/opencode-desktop-linux-x64.deb
              mv -f packages/desktop/dist/opencode-desktop-linux-x86_64.rpm packages/desktop/dist/opencode-desktop-linux-x64.rpm
              ;;
            linux-arm64)
              mv -f packages/desktop/dist/opencode-desktop-linux-aarch64.rpm packages/desktop/dist/opencode-desktop-linux-arm64.rpm
              ;;
            windows-x64)
              ;;
          esac

      - name: Verify desktop artifacts
        shell: bash
        run: |
          set -euo pipefail
          find packages/desktop/dist -maxdepth 2 -type f -print

          case "${{ matrix.settings.name }}" in
            linux-x64)
              test -s packages/desktop/dist/opencode-desktop-linux-x64.AppImage
              test -s packages/desktop/dist/opencode-desktop-linux-x64.deb
              test -s packages/desktop/dist/opencode-desktop-linux-x64.rpm
              ;;
            linux-arm64)
              test -s packages/desktop/dist/opencode-desktop-linux-arm64.AppImage
              test -s packages/desktop/dist/opencode-desktop-linux-arm64.deb
              test -s packages/desktop/dist/opencode-desktop-linux-arm64.rpm
              ;;
            windows-x64)
              test -s packages/desktop/dist/opencode-desktop-win-x64.exe
              ;;
          esac

      - name: Upload desktop assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-zh-desktop-${{ matrix.settings.name }}
          path: |
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - sync-localize
      - build-cli
      - build-desktop
    if: needs.sync-localize.outputs.should_release == 'true'
    steps:
      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opencode-zh-release-notes
          path: release-notes

      - name: Download CLI assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opencode-zh-cli-assets
          path: release-assets

      - name: Download desktop assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: opencode-zh-desktop-*
          path: release-desktop-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.ZH_RELEASE_TOKEN || github.token }}
          TAG: ${{ needs.sync-localize.outputs.tag }}
          TITLE: ${{ needs.sync-localize.outputs.title }}
          HEAD_SHA: ${{ needs.sync-localize.outputs.head_sha }}
        run: |
          set -euo pipefail

          notes="release-notes/opencode-zh-release-notes.md"
          mapfile -d '' cli_assets < <(find release-assets -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 | sort -z)
          mapfile -d '' desktop_assets < <(find release-desktop-assets -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' \) -print0 | sort -z)

          if [ "${#cli_assets[@]}" -ne 3 ]; then
            echo "Expected 3 CLI release assets, found ${#cli_assets[@]}."
            find release-assets -maxdepth 5 -type f -print
            exit 1
          fi

          if [ "${#desktop_assets[@]}" -ne 7 ]; then
            echo "Expected 7 desktop release assets, found ${#desktop_assets[@]}."
            find release-desktop-assets -maxdepth 5 -type f -print
            exit 1
          fi

          assets=("${cli_assets[@]}" "${desktop_assets[@]}")

          if gh release view "$TAG" --repo "$DOWNSTREAM_REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$DOWNSTREAM_REPO" --target "$HEAD_SHA" --title "$TITLE" --notes-file "$notes"
            gh release upload "$TAG" "${assets[@]}" --repo "$DOWNSTREAM_REPO" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --repo "$DOWNSTREAM_REPO" \
              --target "$HEAD_SHA" \
              --title "$TITLE" \
              --notes-file "$notes"
          fi
