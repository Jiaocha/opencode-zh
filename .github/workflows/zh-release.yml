name: zh-release

on:
  schedule:
    # 姣忓ぉ鍖椾含鏃堕棿 02:00 妫€鏌ヤ笂娓?dev 鍒嗘敮銆?
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "瑕佸悓姝ョ殑涓婃父鍒嗘敮銆佹爣绛炬垨鎻愪氦"
        required: false
        default: "dev"
      create_release:
        description: "鏋勫缓鎴愬姛鍚庡垱寤烘垨鏇存柊 GitHub Release"
        required: false
        type: boolean
        default: true
      force_release:
        description: "鍗充娇娌℃湁鏂扮殑涓婃父鎻愪氦涔熼噸鏂版眽鍖栥€佹瀯寤哄苟鍙戝竷"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: zh-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UPSTREAM_REPO: anomalyco/opencode
  DOWNSTREAM_REPO: Jiaocha/opencode-zh
  DEFAULT_UPSTREAM_REF: dev
  BUILD_TARGETS: linux-x64,linux-arm64,windows-x64

jobs:
  sync-localize:
    name: 鍚屾涓婃父骞跺簲鐢ㄦ眽鍖?
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      should_release: ${{ steps.plan.outputs.should_release }}
      upstream_ref: ${{ steps.plan.outputs.upstream_ref }}
      upstream_before: ${{ steps.plan.outputs.upstream_before }}
      upstream_after: ${{ steps.plan.outputs.upstream_after }}
      head_sha: ${{ steps.push.outputs.head_sha }}
      version: ${{ steps.release_notes.outputs.version }}
      tag: ${{ steps.release_notes.outputs.tag }}
      title: ${{ steps.release_notes.outputs.title }}
    steps:
      - name: Checkout downstream repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.ZH_RELEASE_TOKEN || github.token }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Plan upstream synchronization
        id: plan
        env:
          UPSTREAM_REF_INPUT: ${{ github.event.inputs.upstream_ref }}
          CREATE_RELEASE_INPUT: ${{ github.event.inputs.create_release }}
          FORCE_RELEASE_INPUT: ${{ github.event.inputs.force_release }}
        run: |
          set -euo pipefail

          upstream_ref="${UPSTREAM_REF_INPUT:-$DEFAULT_UPSTREAM_REF}"
          create_release="${CREATE_RELEASE_INPUT:-true}"
          force_release="${FORCE_RELEASE_INPUT:-false}"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || \
            git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "$upstream_ref" --tags --prune

          preserve_dir="$(mktemp -d)"
          for item in README.md localization .github/workflows/zh-release.yml script/zh-release-notes.ts; do
            if [ -e "$item" ]; then
              mkdir -p "$preserve_dir/$(dirname "$item")"
              cp -a "$item" "$preserve_dir/$item"
            fi
          done

          upstream_sha="$(git rev-parse FETCH_HEAD)"
          upstream_before="$(git merge-base HEAD "$upstream_sha")"

          {
            echo "upstream_ref=$upstream_ref"
            echo "upstream_before=$upstream_before"
            echo "upstream_after=$upstream_sha"
          } >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            if [ "$force_release" != "true" ]; then
              echo "涓婃父 $UPSTREAM_REPO@$upstream_ref 宸插寘鍚湪褰撳墠鍒嗘敮涓紝璺宠繃鏋勫缓涓庡彂甯冦€?
              {
                echo "should_build=false"
                echo "should_release=false"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "鏈彂鐜版柊鐨勪笂娓告彁浜わ紝浣?force_release=true锛屽皢缁х画閲嶆柊姹夊寲涓庢瀯寤恒€?
          else
            git merge --no-edit --no-ff -X theirs "$upstream_sha"
            for item in README.md localization .github/workflows/zh-release.yml script/zh-release-notes.ts; do
              if [ -e "$preserve_dir/$item" ]; then
                rm -rf "$item"
                mkdir -p "$(dirname "$item")"
                cp -a "$preserve_dir/$item" "$item"
              fi
            done
          fi

          {
            echo "should_build=true"
            echo "should_release=$create_release"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        if: steps.plan.outputs.should_build == 'true'
        uses: ./.github/actions/setup-bun

      - name: Apply Simplified Chinese localization
        if: steps.plan.outputs.should_build == 'true'
        run: bun run ./localization/scripts/localize-onekey.ts

      - name: Check localization completeness
        if: steps.plan.outputs.should_build == 'true'
        run: bun run ./localization/scripts/check-complete.ts

      - name: Commit and push localized downstream state
        if: steps.plan.outputs.should_build == 'true'
        id: push
        run: |
          set -euo pipefail

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync upstream and apply zh-CN localization"
          else
            echo "娌℃湁鐢熸垚鏂扮殑姹夊寲鏀瑰姩銆?
          fi

          head_sha="$(git rev-parse HEAD)"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Generate Chinese release notes
        if: steps.plan.outputs.should_build == 'true'
        id: release_notes
        env:
          UPSTREAM_REF: ${{ steps.plan.outputs.upstream_ref }}
          UPSTREAM_BEFORE: ${{ steps.plan.outputs.upstream_before }}
          UPSTREAM_AFTER: ${{ steps.plan.outputs.upstream_after }}
          DOWNSTREAM_SHA: ${{ steps.push.outputs.head_sha }}
        run: bun run ./script/zh-release-notes.ts

      - name: Upload release notes
        if: steps.plan.outputs.should_build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-zh-release-notes
          path: ${{ steps.release_notes.outputs.notes }}
          if-no-files-found: error
          retention-days: 14

  build-cli:
    name: 鏋勫缓 CLI 姹夊寲璧勪骇
    runs-on: ubuntu-latest
    needs: sync-localize
    if: needs.sync-localize.outputs.should_build == 'true'
    steps:
      - name: Checkout localized commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.sync-localize.outputs.head_sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Check localization completeness
        run: bun run ./localization/scripts/check-complete.ts

      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Build selected release targets
        env:
          OPENCODE_VERSION: ${{ needs.sync-localize.outputs.version }}
        run: bun run ./packages/opencode/script/build.ts --targets "$BUILD_TARGETS" --archive

      - name: Verify build artifacts
        env:
          OPENCODE_VERSION: ${{ needs.sync-localize.outputs.version }}
        run: |
          set -euo pipefail

          linux_x64="packages/opencode/dist/opencode-linux-x64.tar.gz"
          linux_arm64="packages/opencode/dist/opencode-linux-arm64.tar.gz"
          windows_x64="packages/opencode/dist/opencode-windows-x64.zip"

          test -s "$linux_x64"
          test -s "$linux_arm64"
          test -s "$windows_x64"

          tar -tzf "$linux_x64" | grep -E '(^|/)opencode$'
          tar -tzf "$linux_arm64" | grep -E '(^|/)opencode$'
          unzip -l "$windows_x64" | grep -E 'opencode(.exe)?$'

          mkdir -p "$RUNNER_TEMP/opencode-smoke"
          tar -xzf "$linux_x64" -C "$RUNNER_TEMP/opencode-smoke"
          chmod +x "$RUNNER_TEMP/opencode-smoke/opencode"
          "$RUNNER_TEMP/opencode-smoke/opencode" --version | grep "$OPENCODE_VERSION"

      - name: Upload CLI assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-zh-cli-assets
          path: |
            packages/opencode/dist/opencode-linux-x64.tar.gz
            packages/opencode/dist/opencode-linux-arm64.tar.gz
            packages/opencode/dist/opencode-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: 鍙戝竷 GitHub Release
    runs-on: ubuntu-latest
    needs:
      - sync-localize
      - build-cli
    if: needs.sync-localize.outputs.should_release == 'true'
    steps:
      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opencode-zh-release-notes
          path: release-notes

      - name: Download CLI assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opencode-zh-cli-assets
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.ZH_RELEASE_TOKEN || github.token }}
          TAG: ${{ needs.sync-localize.outputs.tag }}
          TITLE: ${{ needs.sync-localize.outputs.title }}
          HEAD_SHA: ${{ needs.sync-localize.outputs.head_sha }}
        run: |
          set -euo pipefail

          notes="release-notes/opencode-zh-release-notes.md"
          mapfile -d '' assets < <(find release-assets -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 | sort -z)

          if [ "${#assets[@]}" -ne 3 ]; then
            echo "鏈熸湜 3 涓彂甯冭祫浜э紝瀹為檯鎵惧埌 ${#assets[@]} 涓€?
            find release-assets -maxdepth 5 -type f -print
            exit 1
          fi

          if gh release view "$TAG" --repo "$DOWNSTREAM_REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$DOWNSTREAM_REPO" --target "$HEAD_SHA" --title "$TITLE" --notes-file "$notes"
            gh release upload "$TAG" "${assets[@]}" --repo "$DOWNSTREAM_REPO" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --repo "$DOWNSTREAM_REPO" \
              --target "$HEAD_SHA" \
              --title "$TITLE" \
              --notes-file "$notes"
          fi
